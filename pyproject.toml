[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-router"
version = "0.1.0"
description = "Intent-router — shared operator-intent → verb-proposal capability (router proposes, kernel decides; kernel-first). P0: architecture + frozen contracts only, no routing logic."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "KleinPerkins" }]
keywords = ["intent", "router", "operator", "safety", "verb-proposal", "kernel-first"]
dependencies = []

[project.scripts]
intent = "intent_router.cli:main"

[tool.setuptools]
packages = ["intent_router"]

[tool.setuptools.package-data]
intent_router = ["../contracts/*.json"]
