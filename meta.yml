schema: kp-capability/v1
id: intent-router
kind: tool
flavor: 2
scope: global
owner: KleinPerkins
install: install.sh
post_mgmt: none
shape: release-descriptor
sync_policy: standalone-release
expose: cursor claude codex
provenance_source: "github.com/KleinPerkins/intent-router"
provenance_ref: "main"
provenance_trust: "vetted"
#
# kind: tool — NOT mcp (LOCKED, non-negotiable).
#   Precedent: AWA's global/tools/awa is a `tool` even though its runtime ships an MCP server.
#   intent-router likewise exposes a (future, read-only) MCP mirror but IS a tool. Mis-classifying
#   this as `kind: mcp` would permanently block the cpp runtime path (mcp masters carry
#   forbidden-ld tokens and are vendored source-free/discoverability-only). Do not change.
#
# Flavor-2 standalone-release binding (SSP + GCB — same doctrine as AWA).
#   intent-router is a Standalone System Package: a self-contained capability (frozen contracts +
#   deterministic router runtime, built incrementally behind gates) that installs itself from a
#   fresh clone of KleinPerkins/intent-router via its own install.sh, with no sibling-repo
#   dependency. When enrolled, the shelf entry is the Global Capability Binding to a pinned release;
#   the shelf carries the pinned release pointer, never the runtime bytes.
#
# Repo-home is BOTH (LOCKED — see ARCHITECTURE.md §Repo-home):
#   (1) this own repo KleinPerkins/intent-router (code, CI, contracts, releases), and
#   (2) a Flavor-2 `standalone-release` pointer at capabilities/skills/global/tools/intent-router.
#   P0 creates ONLY (1) + this meta.yml. Creating the (2) shelf pointer + WF1 registry enrollment is
#   DEFERRED to phase R-surface-complete (keeps P0 zero-link trivially clean; nothing references
#   the ld/cpp edge yet). `provenance_ref: main` is a placeholder pin; R-surface-complete pins an
#   immutable release commit at the shelf.
